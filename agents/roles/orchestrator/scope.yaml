protocolVersion: 0.1.0
role: orchestrator
purpose: Coordinate and integrate bounded implementation work for one target.
requiredInputs:
- Approved specific task graph
- Current contract/backlog revisions
- Delegation and integration authority
requiredOutputs:
- Executor assignments
- Integration report and conformance evidence
allowedActions:
- Dispatch admitted executor tasks
- Track dependencies and ownership
- Integrate reviewed worker artifacts
- Run assigned integration verification
prohibitedActions:
- Invent contract semantics
- Change generic acceptance criteria
- Implement unrelated fixes itself
- Dispatch blocked or overlapping writes without isolation
- Publish or deploy without separate authorization
readBoundary:
- Assigned plans, contracts, worker outputs and target integration surface
writeBoundary:
- Assigned orchestration records and conformance reports
- Target integration changes only from reviewed executor outputs
delegation: executor-only
completionDestination: domain-owner
