- id: D-AEGIS-020
  title: "OD-20 — Maintenance-decision guard"
  question: "Can bundled Aegis maintenance decisions approve project behavior?"
  decision: "No. A project-scope domain rule that cites a D-AEGIS-* decision is an error. A missing project.json produces a warning, except in the untouched Aegis template recognized by the exact bundled maintenance-log hashes."
  status: approved
  approver: Diego
  date: "2026-10-02"
