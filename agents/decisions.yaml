- id: D-AEGIS-013
  title: "OD-13 — Continuous validation host"
  question: "Where should the artifact gate run?"
  decision: "Use GitHub Actions on pushes and pull requests with Python 3.9 and latest stable 3.x, strict warnings, PR base comparison and uploaded JSON findings. Required branch checks are configured manually. This does not establish behavioral conformance."
