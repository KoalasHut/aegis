name: Aegis validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.x']
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository and base branches
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # All branches are fetched by checkout; no retained token is needed
          # for a later git fetch, including in private template-derived repos.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true
          allow-prereleases: false

      - name: Install validation dependencies
        id: dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate artifacts
        # Preserve diagnostics even when the test step fails; do not mask failure.
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p validation-results
          python3 scripts/validate.py --json --strict > validation-results/validation.json

      - name: Validate approved rules against the PR base
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          AEGIS_BASE_REF: ${{ github.base_ref }}
        run: |
          # Treat the event's branch name as data, never as shell source.
          git show-ref --verify -- "refs/remotes/origin/${AEGIS_BASE_REF}"
          python3 scripts/validate.py --base "origin/${AEGIS_BASE_REF}" --json --strict > validation-results/base-validation.json

      - name: Upload validator results
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-python-${{ matrix.python-version }}
          path: validation-results/*.json
          if-no-files-found: error
          retention-days: 14
