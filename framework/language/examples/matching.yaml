types:
  TaskState:
    description: Whether a task still needs attention.
    enum: [open, complete]
  AccentState:
    description: A state whose spelling demonstrates raw enum comparison.
    enum: ["café"]
  Task:
    description: A task used by the matching examples.
    fields:
      id: {type: id, required: true}
      title: {type: string, required: true}
      state: {type: TaskState, required: true}
      dueAt: {type: datetime}
      note: {type: string}
      tags: {type: "string[]"}
      metadata: {type: "map<string>"}
  Envelope:
    description: A nested task result.
    fields:
      task: {type: Task, required: true}
  TaskTree:
    description: A recursive task tree.
    fields:
      task: {type: Task, required: true}
      children: {type: "TaskTree[]"}
  CaptureOutput:
    description: Typed values available from a captured operation output.
    fields:
      item: {type: Task, required: true}
      items: {type: "Task[]", required: true}
      metadata: {type: "map<string>", required: true}
      optionalId: {type: id}
  LegacyRule: A prose-only legacy rule.

