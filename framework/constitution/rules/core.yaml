- id: CORE-001
  title: Every block represents one meaningful capability or concept
  level: MUST
  scope:
  - block
  - concept-pack
  statement: Every block represents one meaningful capability or concept.
  rationale: Keep capability boundaries understandable and authoritative.
  verification:
    type: review
    automatable: false
  failure:
    severity: error
    code: CORE-001-VIOLATION
  waiver:
    allowed: false
