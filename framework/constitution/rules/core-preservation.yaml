- id: CPR-001
  title: Blocks enforce identified domain rules
  level: MUST
  scope:
  - block
  - concept-pack
  statement: Every business rule enforced by a block is a domain rule with an ID.
  rationale: Preserve business behavior as a context-owned, versioned asset.
  verification:
    type: review
    automatable: false
  failure:
    severity: error
    code: CPR-001-VIOLATION
  waiver:
    allowed: false
- id: CPR-002
  title: Context vocabulary and rules remain implementation-neutral
  level: MUST
  scope:
  - context
  - domain-rule
  statement: Domain rules and glossary contain no platform, language, framework, or storage terms unless a constraint source makes the term intrinsic.
  rationale: Keep the core usable across implementation rewrites.
  verification:
    type: semantic
    automatable: false
  failure:
    severity: error
    code: CPR-002-VIOLATION
  waiver:
    allowed: false
- id: CPR-003
  title: Approved domain rules cite their decision
  level: MUST
  scope:
  - domain-rule
  statement: An approved domain rule references its approving decision.
  rationale: Make owner approval and the reason for the rule auditable.
  verification:
    type: structural
    automatable: true
  failure:
    severity: error
    code: CPR-003-VIOLATION
  waiver:
    allowed: false
- id: CPR-004
  title: Approved rule statements are superseded rather than rewritten
  level: MUST NOT
  scope:
  - domain-rule
  statement: The statement of an approved domain rule is edited in place.
  rationale: Preserve the meaning and history that an implementation must conform to.
  verification:
    type: structural
    automatable: true
  failure:
    severity: error
    code: CPR-004-VIOLATION
  waiver:
    allowed: false
- id: CPR-005
  title: Approved automated rules have scenario coverage
  level: SHOULD
  scope:
  - domain-rule
  - scenario
  statement: Every approved domain rule with automated verification has at least one scenario.
  rationale: Make the most important executable behavior visible and checkable.
  verification:
    type: structural
    automatable: true
  failure:
    severity: warning
    code: CPR-005-VIOLATION
  waiver:
    allowed: false
- id: CPR-006
  title: Approved decisions are superseded rather than rewritten
  level: MUST NOT
  scope:
  - decision
  statement: The governed fields or approval status of an approved decision are edited in place, except to mark it superseded by a new approved decision.
  rationale: Preserve the authority and history behind approved domain rules.
  verification:
    type: structural
    automatable: true
  failure:
    severity: error
    code: CPR-006-VIOLATION
  waiver:
    allowed: false
- id: CPR-007
  title: Local-time rules identify their zone basis
  level: SHOULD
  scope:
  - domain-rule
  statement: A policy or calculation involving today, this week, or local time names whose time zone applies.
  rationale: Keep business dates independent of the host machine's default time zone.
  verification:
    type: review
    automatable: false
  failure:
    severity: warning
    code: CPR-007-VIOLATION
  waiver:
    allowed: false
- id: CPR-008
  title: Text-ordering rules identify their collation
  level: SHOULD
  scope:
  - domain-rule
  statement: A domain rule that orders or compares text declares ordinal or named-locale collation.
  rationale: Keep text ordering explicit across stacks and collation-library versions.
  verification:
    type: review
    automatable: false
  failure:
    severity: warning
    code: CPR-008-VIOLATION
  waiver:
    allowed: false
