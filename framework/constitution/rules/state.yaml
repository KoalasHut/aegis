- id: STA-001
  title: State ownership is explicit
  level: MUST
  scope:
  - block
  - concept-pack
  statement: State ownership is explicit.
  rationale: Prevent ambiguous ownership and unauthorized mutation.
  verification:
    type: review
    automatable: false
  failure:
    severity: error
    code: STA-001-VIOLATION
  waiver:
    allowed: false
