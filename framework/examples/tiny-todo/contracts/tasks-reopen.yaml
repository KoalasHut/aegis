id: tasks.reopen
version: 1.0.0
kind: command
summary: Reopen a completed task.
types: {}
input:
  taskId:
    type: id
    required: true
    description: The identity of the task to reopen.
output:
  task:
    type: Task
    required: true
    description: The reopened task.
errors:
  - code: TASK_UNKNOWN
    meaning: No task has the requested identity.
semantics:
  - Reopening a task restores it without changing its position.
