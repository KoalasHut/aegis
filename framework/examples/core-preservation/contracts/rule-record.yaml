id: core-preservation.rule.record
version: 1.0.0
kind: command
summary: Record a reviewed domain rule.
types: {}
input:
  title:
    type: string
    required: true
    description: The rule's business statement title.
  owner:
    type: string
    required: true
    description: The accountable rule owner.
  decision:
    type: string
    required: false
    description: The approving decision identifier.
output:
  rule:
    type: Rule
    required: true
    description: The recorded rule.
errors:
  - code: DECISION_REQUIRED
    meaning: An approved rule requires its approving decision.
semantics:
  - A recorded approved rule identifies its accountable owner.
