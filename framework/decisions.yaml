- id: D-AEGIS-036
  title: "OD-36 — NFC-unique raw enums"
  question: "How are enum values declared and compared?"
  decision: "Enum declaration values are unique after NFC normalization. Runtime enum membership and equality remain raw and case-sensitive, without Unicode normalization; literals outside the declared raw set are INVALID_ENUM_VALUE."
  status: approved
  approver: Diego
