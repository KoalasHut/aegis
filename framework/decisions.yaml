- id: D-AEGIS-019
  title: "OD-19 — Contract-declared value types"
  question: "How does validation choose typed value semantics?"
  decision: "Choose typed parsing and comparison from the contract-declared scalar type, never from a value's shape. Top-level scenario literals are validated against those declarations; nested contract fields remain opaque."
  status: approved
  approver: Diego
  date: "2026-10-02"
  source: "Aegis maintenance conversation, 2026-10-02; Diego granted the same authority as the prior round and approved OD-14 through OD-20 using the proposal defaults plus the documented minute-precision Aegis-profile clarification; retained by aegis-022-orchestration and aegis-022-release. Plan SHA256 19b8c6ec15e5af12faca29f6b8a44a823b4a3570ce0253d960438fbca317af4c."
