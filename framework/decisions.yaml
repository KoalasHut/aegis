    - scripts/aegis_match.py
- id: D-AEGIS-031
  title: "OD-31 — Declared text collation"
  question: "How must rules define text ordering?"
  decision: "A text-ordering rule declares ordinal NFC code-point order or a named locale. Collation remains schema-optional because CPR-008 is review-only and applicability is decided by semantic review, not prose heuristics. Ordinal is the only portable automated collation profile in 0.2.3; locale-aware assertions require manual verification until phase 3 records versioned collation capabilities."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
  affects:
