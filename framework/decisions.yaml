- id: D-AEGIS-037
  title: "OD-37 — Matchers only in expectations"
  question: "Where may matcher keys appear?"
  decision: "Matcher keys are allowed only in then.output, then.observe[].expect, and then.events[].input. All input positions, including given.seed.input, given.steps[].input, when.input and then.observe[].input, require concrete values and reject $-prefixed keys with MATCHER_IN_INPUT."
  status: approved
  approver: Diego
