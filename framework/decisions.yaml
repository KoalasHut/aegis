- id: D-AEGIS-003
  title: "OD-3 — Structured scenarios"
  question: "Which scenario format is authoritative?"
  decision: "Use structured YAML scenarios owned by contexts and reviewed with rules and glossary. Behavioral execution remains deferred."
  status: approved
  approver: Diego
  date: "2026-10-01"
  source: "Aegis maintenance conversation, 2026-10-01; Diego approved OD-1 through OD-7; retained by aegis-020-workflow/aegis-020-orchestrator. Proposal SHA256 9f0412c5c4c2048e7454fceba3ee31b5c0b31d426268f036600b7a835cd5da29. Transcribed under aegis-021-release."
