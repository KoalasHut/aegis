- id: D-AEGIS-028
  title: "OD-28 — Canonical typed wire values"
  question: "Which JSON forms preserve typed values between a runner and driver?"
  decision: "Canonical protocol inputs encode decimal as a string; integer as a JSON number intrinsically restricted to plus or minus 2^53 minus 1; datetime with an RFC 3339 offset; date as YYYY-MM-DD; and duration as ISO 8601. A driver output may use a lossless valid alternate accepted by the type matcher; a lossy or invalid form becomes a phase-3 protocol error or mismatch."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
  affects:
