- id: D-AEGIS-033
  title: "OD-33 — Type-safe capture substitution"
  question: "Where may a captured value be substituted?"
  decision: "Capture paths traverse resolved record fields only; list indexing is forbidden, maps are captured only as whole values, and whole record, list or map captures remain complete values. Source and target resolved normalized types must be equal, including event payload targets; id and string are incompatible. Missing optional captured values produce a phase-3 setup error."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
