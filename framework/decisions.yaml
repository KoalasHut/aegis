    - scripts/aegis_match.py
- id: D-AEGIS-027
  title: "OD-27 — Exact number and decimal comparison"
  question: "How are number and decimal representations compared?"
  decision: "Replace OD-17 with exact normalized decimal-value comparison for number and decimal, with no tolerance. Equivalent exponent, trailing-zero and signed-zero representations compare equally; 0.30000000000000004 does not equal 0.3. Decimal scenario number lexemes are preserved for exact parsing, while canonical protocol inputs use decimal strings. Integer remains a JSON number under OD-28."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
