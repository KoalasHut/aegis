    - framework/language/domain-rule-spec.md
    - scripts/validate.py
- id: D-AEGIS-030
  title: "OD-30 — NFC string equality"
  question: "How do text and identifiers compare across stacks?"
  decision: "Compare string values code point by code point after NFC normalization, without case folding or trimming. Compare id values raw. Enum membership and equality remain raw and case-sensitive; ordinal text ordering first applies NFC."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
