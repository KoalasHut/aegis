- id: D-AEGIS-016
  title: "OD-16 — Date-time comparison"
  question: "How are declared date-time values compared across stacks?"
  decision: "Parse offset-bearing values using the Aegis RFC 3339 profile and compare instants on the timeline. The expected value defines comparison precision. The profile also accepts an offset-bearing minute-precision form, whose interval covers that minute; second and fractional forms use their stated precision."
  status: approved
  approver: Diego
  date: "2026-10-02"
  source: "Aegis maintenance conversation, 2026-10-02; Diego granted the same authority as the prior round and approved OD-14 through OD-20 using the proposal defaults plus the documented minute-precision Aegis-profile clarification; retained by aegis-022-orchestration and aegis-022-release. Plan SHA256 19b8c6ec15e5af12faca29f6b8a44a823b4a3570ce0253d960438fbca317af4c."
