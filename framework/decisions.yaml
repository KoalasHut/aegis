  question: "How should neutrality vocabulary avoid ambiguous language?"
  decision: "Match configurable phrases case-insensitively, replace ambiguous single words and allow a reviewed per-context neutrality-allow.txt. Scan glossary and relevant contract prose as well as rules and scenarios."
