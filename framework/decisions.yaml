- id: D-AEGIS-022
  title: "OD-22 — Closed type grammar and normalized model"
  question: "Which type forms and normalized identities does Aegis support?"
  decision: "Use the nine scalars, closed enums, records, lists, maps and named references, with no inline type-expression unions in 0.2.x; existing contract-level union kinds remain valid. Requiredness lives on record fields, references remain lazy and cycle-safe, and type equality compares resolved normalized trees. Context and local records replace OD-19's nested-opacity limit."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
  supersedes: D-AEGIS-019
