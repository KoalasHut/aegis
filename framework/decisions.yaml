- id: D-AEGIS-021
  title: "OD-21 — Context-owned domain types"
  question: "Where do reusable domain types live?"
  decision: "A context owns one types.yaml beside its glossary. Contracts reference context types by name and reserve contract-local types for operation-specific shapes. Qualified imported context.Type references are reserved for manifest-based namespace and version resolution; 0.2.3 does not claim imported-type validation."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
