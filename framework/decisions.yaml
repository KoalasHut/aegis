- id: D-AEGIS-023
  title: "OD-23 — Opaque type migration"
  question: "How are prose-only types handled during 0.2.x?"
  decision: "Treat a prose-only type as opaque during 0.2.x, warn with OPAQUE_TYPE, compare its complete value strictly and skip validation below that boundary. It becomes an error in 0.3.0. Unused-type reachability starts at contract fields and follows references; self-reference alone does not establish use."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
  affects:
