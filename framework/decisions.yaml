- id: D-AEGIS-039
  title: "OD-39 — RFC 3339 datetime separator"
  question: "Which separator may appear between a date and time?"
  decision: "The Aegis RFC 3339 profile accepts only T or t between date and time. A space separator, including Python str(datetime) output, is rejected; drivers use isoformat() or an equivalent RFC 3339 serializer."
  status: approved
  approver: Diego
  date: "2026-10-05"
