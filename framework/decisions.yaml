    - framework/constitution/rules/core-preservation.yaml
- id: D-AEGIS-032
  title: "OD-32 — Closed raw enums"
  question: "How are enumerated values declared and compared?"
  decision: "An enum is a closed set of unique, non-empty strings. Validation and comparison use raw, case-sensitive membership without Unicode normalization; literals outside the set are INVALID_ENUM_VALUE."
