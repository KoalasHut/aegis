- id: D-AEGIS-035
  title: "OD-35 — NFC map-key comparison"
  question: "How are typed map keys compared?"
  decision: "Keys of a resolved map<string> compare after NFC normalization, like string values. A literal or actual map with keys that collide after NFC is invalid or a non-match respectively. Record field identifiers remain raw."
  status: approved
  approver: Diego
