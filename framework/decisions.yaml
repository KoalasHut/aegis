- id: D-AEGIS-015
  title: "OD-15 — Captures on failed setup"
  question: "Can an expected-error setup step capture output?"
  decision: "No. A setup step with expectError has no output and must not declare as; the error code is asserted by expectError itself."
  status: approved
  approver: Diego
  date: "2026-10-02"
