- id: D-AEGIS-040
  title: "OD-40 — Required-record satisfiability"
  question: "When is a recursive record type unsatisfiable?"
  decision: "A record type is unsatisfiable when every finite value requires an infinite chain of required record fields. Optional, list and map edges break that chain. An unsatisfiable definition reports UNSATISFIABLE_TYPE whether used or unused."
  status: approved
  approver: Diego
