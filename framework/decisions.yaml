- id: D-AEGIS-017
  title: "OD-17 — Numeric comparison"
  question: "How are declared numeric values compared?"
  decision: "Compare integer, number and decimal fields by numeric value, so 1 equals 1.0. Decimal comparison uses exact decimal arithmetic. Strings are never coerced to numbers."
  status: superseded
  approver: Diego
  date: "2026-10-02"
