- id: D-AEGIS-026
  title: "OD-26 — Component-normalized durations"
  question: "How are calendar and fixed duration components compared?"
  decision: "Normalize durations to years, months and fixed seconds. Years and months remain distinct; weeks cannot mix with other components; fixed days and time units normalize by length. Mixed values therefore make P1M1D equal P1MT24H, explicit zero components do not change a value, P1Y is not P12M and P1M is not P30D."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
  affects:
