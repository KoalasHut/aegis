- id: D-AEGIS-038
  title: "OD-38 — Poisoned type diagnostic precedence"
  question: "How do malformed type definitions affect dependent validation?"
  decision: "Report a root resolution or definition error once at its declaration or direct contract field, then propagate poison silently through dependent named, list, map and record nodes. Suppress dependent satisfiability, unused-type, opaque, typed-value and capture-type findings while independent artifacts continue validation."
  status: approved
  approver: Diego
