- id: D-AEGIS-034
  title: "OD-34 — One visible finding per root cause"
  question: "How are dependent diagnostics for one cause reported?"
  decision: "Retain the highest-priority finding for a deterministic same-cause key and suppress lower-priority dependent findings by default. --verbose-findings exposes suppressed items without changing counts or exit behavior. Same-scope warning-only decision-backed allowances apply after suppression, stay visible, and make allowed warnings non-failing under --strict; invalid, stale, duplicate or overbroad allowances remain findings."
  status: approved
  approver: Diego
  date: "2026-10-03"
