    - scripts/validate.py
- id: D-AEGIS-024
  title: "OD-24 — No-value equivalence"
  question: "How do absent and null observable values compare?"
  decision: "For optional values, absent and null are the same observable value. Expected null and $absent accept either; $any requires a present non-null value. Optional inputs may be absent or null. This expectation rule is separate from the phase-3 gate that will validate complete actual outputs."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
  affects:
    - framework/language/scenario-spec.md
    - scripts/aegis_match.py
- id: D-AEGIS-025
  title: "OD-25 — Required means present and non-null"
  question: "How are required and nullable fields represented?"
  decision: "required: true means a field is always present and non-null; optional fields may have no value, and there is no nullable flag. Required input literals are validated now. Partial expected objects remain partial matches; phase 3 separately validates required fields in actual driver outputs before matching."
  status: approved
  approver: Diego
  date: "2026-10-03"
  source: "Aegis maintenance conversation, 2026-10-03; Diego accepted OD-21 through OD-34 defaults plus the orchestrator's conservative resolutions of audit S-02 through S-24; captured by aegis-023-release. Plan SHA256 836f81d6b492d1ef14cbf6f11dd7a14e63ceca7b47811b3f168a22fda7a5237e; audit SHA256 9c2eba21568f176c3883dfdbb22415c2d0a219951722b6678f136af395813f5e; reviewed Wave 1 baseline 58d258d30d08dfd00de6b5e5ac59b9a0916132a9."
  affects:
