- id: D-AEGIS-018
  title: "OD-18 — One-to-one array matching"
  question: "Can one actual array element satisfy multiple expected elements?"
  decision: "No. Each expected element under $contains and $unordered must match a distinct actual element. $unordered also requires every actual element to be used."
  status: approved
  approver: Diego
  date: "2026-10-02"
