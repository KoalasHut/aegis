id: tasks.add
version: 1.0.0
kind: command
summary: Record a task.
types:
  Task: A task with a meaningful title.
input:
  title:
    type: string
    required: true
    description: The task title.
output:
  item:
    type: Task
    required: true
    description: The recorded task.
errors:
  - code: TITLE_EMPTY
    meaning: The task title has no meaningful content.
semantics:
  - A task is recorded when its title is meaningful.
